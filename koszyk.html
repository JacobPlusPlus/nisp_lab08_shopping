<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ShopWave — Koszyk</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="header">
    <div class="header__inner">
      <a href="index.html" class="logo">Shop<span>Wave</span></a>
      <nav class="nav">
        <a href="index.html" class="nav__link">Lista zakupów</a>
        <a href="koszyk.html" class="nav__link active">Koszyk</a>
        <a href="zamowienie.html" class="nav__link">Zamówienie</a>
      </nav>
      <a href="koszyk.html" class="cart-btn" aria-label="Koszyk">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13l-1.5 6h13M7 13L5.4 5M10 21a1 1 0 100-2 1 1 0 000 2zm8 0a1 1 0 100-2 1 1 0 000 2z"/>
        </svg>
        <span class="cart-count" id="cartCount">0</span>
      </a>
    </div>
  </header>

  <section class="products" id="koszyk">
    <div class="products__header">
      <h2 class="section-title">Twój <span>Koszyk</span></h2>
      <p class="section-sub">Tutaj znajdziesz wybrane przez siebie produkty</p>
    </div>
    <div class="products__grid" id="koszykGrid"></div>
    <div class="cart-summary" id="cartSummary">
      <p class="cart-total">Łączna kwota: <strong id="totalPrice">0 zł</strong></p>
      <a href="zamowienie.html" class="btn">Przejdź do zamówienia</a>
    </div>
  </section>

  <footer class="footer">
    <p>© 2025 ShopWave · Wszelkie prawa zastrzeżone</p>
  </footer>
  <script src="koszyk.js"></script>
</body>
</html>
